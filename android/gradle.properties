org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=384m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# The project lives under a path containing a space
# ("G:\Development Setup\..."). Kotlin's incremental compilation caches
# are tab-separated files that use the path separator as a delimiter, so
# a space in the project path corrupts them and every build dies with
# "Could not close incremental caches ... class-fq-name-to-source.tab".
# Incremental Kotlin is disabled until the project can live under a
# path without spaces.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The build machine has an intermittently unstable connection: a large
# artifact download came down corrupted ("bad_record_mac: Tag mismatch"),
# which Gradle happily cached. Retrying on its own reuses the corrupt
# file, so the build has to be told to verify and refetch.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
org.gradle.internal.repository.max.retries=8
org.gradle.internal.repository.initial.backoff=1000
